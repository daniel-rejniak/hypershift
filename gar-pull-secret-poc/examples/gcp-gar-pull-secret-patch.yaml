# HostedCluster merge patch; use on the management cluster.
# Run these commands from the gar-pull-secret-poc directory.
# First create gcp-gar-pull-secret in the HostedCluster namespace:
#
# kubectl -n "$HC_NAMESPACE" create secret generic gcp-gar-pull-secret \
#   --type=kubernetes.io/dockerconfigjson \
#   --from-file=.dockerconfigjson="$MERGED_PULL_SECRET_FILE"
#
# MERGED_PULL_SECRET_FILE must contain a supplied Docker config JSON with
# existing registry credentials retained and GAR credentials added under
# auths["us-central1-docker.pkg.dev"]. Do not commit that file.
# Credential acquisition and renewal are outside this spike.
#
# Then apply both examples on a cluster running vanilla HyperShift:
# kubectl -n "$HC_NAMESPACE" patch hostedcluster "$HC_NAME" --type=merge \
#   --patch-file=examples/gcp-gar-pull-secret-patch.yaml
# kubectl -n "$HC_NAMESPACE" patch hostedcluster "$HC_NAME" --type=merge \
#   --patch-file=examples/gcp-gar-mirror-patch.yaml
#
# Start without the helper ConfigMap attached to NodePools, and validate on
# fresh workers. GCP workers are not eligible for the current global pull-secret
# sync DaemonSet; this does not implement automatic on-node credential renewal.
spec:
  pullSecret:
    name: gcp-gar-pull-secret
