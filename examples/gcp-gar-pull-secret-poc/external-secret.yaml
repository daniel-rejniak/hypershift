# Dev-only ESO configuration for the drejniak all-in-one environment.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: gcp-gar-pull-secret-poc
spec:
  conditions:
  - namespaces:
    - clusters-795f77ca-a68b-4b5c-af76-e30749b30a67
    - hypershift
  provider:
    gcpsm:
      auth:
        workloadIdentity:
          clusterLocation: us-central1
          clusterName: dev-mgt-us-c1-drejniak-gke
          clusterProjectID: dev-mgt-us-c1-drejniak
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets-system
      projectID: drejniak-hcp-dev
      secretVersionSelectionPolicy: LatestOrFail
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gcp-gar-pull-secret
  namespace: clusters-795f77ca-a68b-4b5c-af76-e30749b30a67
spec:
  data:
  - remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      key: default-openshift-pull-secret-ci
      metadataPolicy: None
    secretKey: basePullSecret
  - remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      key: gar-pull-secret-poc
      metadataPolicy: None
    secretKey: garPullSecret
    sourceRef:
      storeRef:
        kind: ClusterSecretStore
        name: gcp-gar-pull-secret-poc
  - remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      key: default-openshift-pull-secret
      metadataPolicy: None
    secretKey: redhatPullSecret
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: gcp-gar-pull-secret
    template:
      data:
        .dockerconfigjson: "{{- $base := mustFromJson .basePullSecret -}}\n{{- $gar := mustFromJson .garPullSecret -}}\n{{- if not (kindIs \"map\" $base.auths) -}}\n  {{- fail \"base pull secret must contain an auths object\" -}}\n{{- end -}}\n{{- if not (kindIs \"map\" $gar.auths) -}}\n  {{- fail \"GAR pull secret must contain an auths object\" -}}\n{{- end -}}\n{{- $entry := index $gar.auths \"us-central1-docker.pkg.dev\" -}}\n{{- if not (kindIs \"map\" $entry) -}}\n  {{- fail \"GAR registry credentials are missing\" -}}\n{{- end -}}\n{{- if not $entry.auth -}}\n  {{- fail \"GAR registry auth is empty\" -}}\n{{- end -}}\n{{- $_ := set $base.auths \"us-central1-docker.pkg.dev\" $entry -}}\n{{- $redhat := mustFromJson .redhatPullSecret -}}\n{{- if not (kindIs \"map\" $redhat.auths) -}}\n  {{- fail \"Red Hat pull secret must contain an auths object\" -}}\n{{- end -}}\n{{- $redhatEntry := index $redhat.auths \"registry.redhat.io\" -}}\n{{- if not (kindIs \"map\" $redhatEntry) -}}\n  {{- fail\
          \ \"Red Hat registry credentials are missing\" -}}\n{{- end -}}\n{{- if not $redhatEntry.auth -}}\n  {{- fail \"Red Hat registry auth is empty\" -}}\n{{- end -}}\n{{- $_ := set $base.auths \"registry.redhat.io\" $redhatEntry -}}\n{{- $base | mustToJson -}}\n"
      engineVersion: v2
      mergePolicy: Replace
      type: kubernetes.io/dockerconfigjson
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gcp-gar-pull-secret
  namespace: hypershift
spec:
  data:
  - remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      key: hypershift-operator-pull-secret
      metadataPolicy: None
    secretKey: basePullSecret
  - remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      key: gar-pull-secret-poc
      metadataPolicy: None
    secretKey: garPullSecret
    sourceRef:
      storeRef:
        kind: ClusterSecretStore
        name: gcp-gar-pull-secret-poc
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: global-gcp-secret-manager
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: gcp-gar-pull-secret
    template:
      data:
        .dockerconfigjson: "{{- $base := mustFromJson .basePullSecret -}}\n{{- $gar := mustFromJson .garPullSecret -}}\n{{- if not (kindIs \"map\" $base.auths) -}}\n  {{- fail \"base pull secret must contain an auths object\" -}}\n{{- end -}}\n{{- if not (kindIs \"map\" $gar.auths) -}}\n  {{- fail \"GAR pull secret must contain an auths object\" -}}\n{{- end -}}\n{{- $entry := index $gar.auths \"us-central1-docker.pkg.dev\" -}}\n{{- if not (kindIs \"map\" $entry) -}}\n  {{- fail \"GAR registry credentials are missing\" -}}\n{{- end -}}\n{{- if not $entry.auth -}}\n  {{- fail \"GAR registry auth is empty\" -}}\n{{- end -}}\n{{- $_ := set $base.auths \"us-central1-docker.pkg.dev\" $entry -}}\n{{- $base | mustToJson -}}\n"
      engineVersion: v2
      mergePolicy: Replace
      type: kubernetes.io/dockerconfigjson
