# Dev-only merge patch for ExternalSecret/gcp-gar-pull-secret.
# Preserve the CI Quay credential and GAR credential while using the working
# registry.redhat.io entry from default-openshift-pull-secret in commons-dev.
spec:
  data:
    - secretKey: basePullSecret
      remoteRef:
        key: default-openshift-pull-secret-ci
    - secretKey: garPullSecret
      remoteRef:
        key: gar-pull-secret-poc
      sourceRef:
        storeRef:
          name: gcp-gar-pull-secret-poc
          kind: ClusterSecretStore
    - secretKey: redhatPullSecret
      remoteRef:
        key: default-openshift-pull-secret
  target:
    template:
      data:
        .dockerconfigjson: |
          {{- $base := mustFromJson .basePullSecret -}}
          {{- $gar := mustFromJson .garPullSecret -}}
          {{- if not (kindIs "map" $base.auths) -}}
            {{- fail "base pull secret must contain an auths object" -}}
          {{- end -}}
          {{- if not (kindIs "map" $gar.auths) -}}
            {{- fail "GAR pull secret must contain an auths object" -}}
          {{- end -}}
          {{- $entry := index $gar.auths "us-central1-docker.pkg.dev" -}}
          {{- if not (kindIs "map" $entry) -}}
            {{- fail "GAR registry credentials are missing" -}}
          {{- end -}}
          {{- if not $entry.auth -}}
            {{- fail "GAR registry auth is empty" -}}
          {{- end -}}
          {{- $_ := set $base.auths "us-central1-docker.pkg.dev" $entry -}}
          {{- $redhat := mustFromJson .redhatPullSecret -}}
          {{- if not (kindIs "map" $redhat.auths) -}}
            {{- fail "Red Hat pull secret must contain an auths object" -}}
          {{- end -}}
          {{- $redhatEntry := index $redhat.auths "registry.redhat.io" -}}
          {{- if not (kindIs "map" $redhatEntry) -}}
            {{- fail "Red Hat registry credentials are missing" -}}
          {{- end -}}
          {{- if not $redhatEntry.auth -}}
            {{- fail "Red Hat registry auth is empty" -}}
          {{- end -}}
          {{- $_ := set $base.auths "registry.redhat.io" $redhatEntry -}}
          {{- $base | mustToJson -}}
